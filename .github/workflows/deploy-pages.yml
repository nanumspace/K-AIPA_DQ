name: Deploy GitHub Pages

# 공개 사이트의 명세·규칙·샘플 기대 결과는 공개 릴리스 태그와 함께 배포한다.
# main 의 미배포 변경으로 설치본과 자료실의 기준이 달라지지 않도록 한다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 공개 릴리스 태그"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 (진행 중인 배포는 취소하지 않고 큐잉)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify published release and matching app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          python -c 'import json,os; assert "v"+json.load(open("app/package.json"))["version"] == os.environ["RELEASE_TAG"]'
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r spec/requirements.txt
      - run: python docs/build_resources.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
