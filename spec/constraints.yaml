  DRUG_EXPOSURE.amount_value:
    range:
    - 0
    - 100000
  DRUG_EXPOSURE.quantity:
    range:
    - 0
    - 100000
  DRUG_EXPOSURE.numerator_unit_concept_id:
    codelist: OMOP.numerator_unit_concept_id
  DRUG_EXPOSURE.denominator_unit_concept_id:
    codelist: OMOP.denominator_unit_concept_id
  DRUG_EXPOSURE.frequency_per_day:
    range:
    - 1
    - 24
  DRUG_EXPOSURE.dosing_interval_day:
    range:
    - 1
    - 180
  DRUG_EXPOSURE.dosing_number:
    range:
    - 1
    - 500
  CONDITION_OCCURRENCE.condition_type_concept_id:
    codelist: OMOP.condition_type_concept_id
  MEASUREMENT.measurement_type_concept_id:
    codelist: OMOP.measurement_type_concept_id
  MEASUREMENT.value_as_number:
    range:
    - -1000000
    - 1000000
  MEASUREMENT.unit_concept_id:
    codelist: OMOP.unit_concept_id
  MEASUREMENT.range_low:
    range:
    - -1000000
    - 1000000
  MEASUREMENT.range_high:
    range:
    - -1000000
    - 1000000
  OBSERVATION.observation_type_concept_id:
    codelist: OMOP.observation_type_concept_id
  OBSERVATION.value_as_number:
    range:
    - -1000000
    - 1000000
  OBSERVATION.unit_concept_id:
    codelist: OMOP.unit_concept_id
  NOTE.note_type_concept_id:
    codelist: OMOP.note_type_concept_id
  NOTE.note_class_concept_id:
    codelist: OMOP.note_class_concept_id
  MASLD.fib4_score:
    range:
    - 0
    - 50
  MASLD.apri_score:
    range:
    - 0
    - 30
  MASLD.bard_score:
    range:
    - 0
    - 4
  MASLD.safe_score:
    range:
    - -50
    - 300
  LYMPHOMA.mipi_score:
    range:
    - 0
    - 15
  LYMPHOMA.hodgkin_ips_score:
    range:
    - 0
    - 7
  LYMPHOMA.pit_score:
    range:
    - 0
    - 4
  SACT.line_of_therapy:
    range:
    - 1
    - 20
  SACT.number_of_cycles:
    range:
    - 1
    - 100
  SACT.ecog_performance_status:
    range:
    - 0
    - 5
  ADVERSE_EVENT.severity_concept_id:
    codelist: OMOP.severity_concept_id
  ADVERSE_EVENT.causality_concept_id:
    codelist: OMOP.causality_concept_id
  ADVERSE_EVENT.seriousness_concept_id:
    codelist: OMOP.seriousness_concept_id
  ADVERSE_EVENT.outcome_concept_id:
    codelist: OMOP.outcome_concept_id
  ADVERSE_EVENT.action_taken_concept_id:
    codelist: OMOP.action_taken_concept_id
