drugs:
  # 항암제 (drug_category: 1 세포독성, 2 표적, 3 호르몬, 4 ADC, 5 면역, 6 기타)
  # dose + dose_unit_label = '정규화 용량'(framework.Ctx.drug/sact 입력의 단위).
  #   mg/m2, unit/m2 → x BSA(Mosteller), mg/kg → x 체중(kg) 으로 신장·체중 기록에서 절대량(mg, unit)으로 바꿔 DRUG_EXPOSURE.amount_value 에 쓴다.
  #   그 밖의 단위(mg, ug, IU)는 이미 절대량이다. BSA·체중 계산 근거는 환자 NOTE("DOSE-CALC v1")에 남긴다.
  # 선택 키(framework 가 해석한다. 명세·검증 규칙과 무관):
  #   max_dose_mg 절대량 상한 · dose_round 절대량 반올림 단위 · freq_per_day 1회 용량 기준 1일 투여 횟수 · course_days 사이클 안 경구 투여 일수
  #   loading_dose(+reload_gap_days: 직전 투여 후 이 일수 이상이면 다시 부하) · reducible false=감량 없이 보류/중단만 · reduce_levels 단계별 용량
  #   tox 이 약이 흔히 일으키는 독성 분류(myelo 골수억제, emesis, diarrhea, mucositis, neuropathy, rash, hepatic) — 이상사례 인과·조치 선택용
  # 용량 출처: 각 약제의 FDA/EMA 허가 라벨 표준 용법(성인, 단독 또는 대표 병용)이다. 요법마다 다른 용량(R-CHOP 의 doxorubicin 50·cyclophosphamide 750,
  #   ABVD 의 doxorubicin 25, XELOX 의 oxaliplatin 130, 주 1회 paclitaxel 80 등)은 기본값이 아니므로 호출 측이 dose_overrides 로 지정한다.
  1397599: {name: cisplatin, category: 1, route: IV, unit: 8576, dose: 75, dose_unit_label: "mg/m2", cycle_days: 21, tox: [myelo, emesis, neuropathy]}
  # carboplatin 은 Calvert 식(AUC x (GFR+25))의 절대량이라 BSA 환산을 하지 않는다. 600 mg 은 AUC 5~6 의 대표값일 뿐이므로 호출 측이 환자별 값을 dose_overrides 로 준다.
  1344905: {name: carboplatin, category: 1, route: IV, unit: 8576, dose: 600, dose_unit_label: "mg", cycle_days: 21, tox: [myelo, emesis]}
  1304919: {name: pemetrexed, category: 1, route: IV, unit: 8576, dose: 500, dose_unit_label: "mg/m2", cycle_days: 21, tox: [myelo, mucositis, rash, hepatic]}
  1378382: {name: paclitaxel, category: 1, route: IV, unit: 8576, dose: 175, dose_unit_label: "mg/m2", cycle_days: 21, tox: [myelo, neuropathy]}
  1315942: {name: docetaxel, category: 1, route: IV, unit: 8576, dose: 75, dose_unit_label: "mg/m2", cycle_days: 21, tox: [myelo, neuropathy, mucositis]}
  1314924: {name: gemcitabine, category: 1, route: IV, unit: 8576, dose: 1000, dose_unit_label: "mg/m2", cycle_days: 21, tox: [myelo, hepatic, rash]}
  35605522: {name: osimertinib, category: 2, route: PO, unit: 8576, dose: 80, dose_unit_label: "mg", cycle_days: 28, reducible: false, tox: [rash, diarrhea]}
  45775965: {name: pembrolizumab, category: 5, route: IV, unit: 8576, dose: 200, dose_unit_label: "mg", cycle_days: 21, reducible: false, tox: [rash, diarrhea, hepatic]}
  1338512: {name: doxorubicin, category: 1, route: IV, unit: 8576, dose: 60, dose_unit_label: "mg/m2", cycle_days: 21, tox: [myelo, emesis, mucositis]}
  1310317: {name: cyclophosphamide, category: 1, route: IV, unit: 8576, dose: 600, dose_unit_label: "mg/m2", cycle_days: 21, tox: [myelo, emesis]}
  # trastuzumab 3주 간격: 첫 투여 8 mg/kg(부하) 이후 6 mg/kg. 직전 투여 후 29일 이상(예정보다 1주 초과 지연) 지나면 다시 8 mg/kg (Herceptin 라벨 2.2~2.3).
  1387104: {name: trastuzumab, category: 2, route: IV, unit: 8576, dose: 6, dose_unit_label: "mg/kg", cycle_days: 21, loading_dose: 8, reload_gap_days: 29, reducible: false}
