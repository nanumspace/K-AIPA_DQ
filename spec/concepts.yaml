  1348265: {name: anastrozole, category: 3, route: PO, unit: 8576, dose: 1, dose_unit_label: "mg", cycle_days: 28}
  1318011: {name: oxaliplatin, category: 1, route: IV, unit: 8576, dose: 85, dose_unit_label: "mg/m2", cycle_days: 14, tox: [myelo, neuropathy, emesis, diarrhea]}
  955632:  {name: fluorouracil, category: 1, route: IV, unit: 8576, dose: 400, dose_unit_label: "mg/m2", cycle_days: 14, tox: [myelo, diarrhea, mucositis, emesis]}
  # capecitabine: dose 는 1회(1일 2회) 용량. 14일 복용 후 7일 휴약(21일 주기). 정제 150 mg 단위로 반올림.
  1337620: {name: capecitabine, category: 1, route: PO, unit: 8576, dose: 1000, dose_unit_label: "mg/m2", cycle_days: 21, freq_per_day: 2, course_days: 14, dose_round: 150, tox: [diarrhea, rash, mucositis, hepatic]}
  1367268: {name: irinotecan, category: 1, route: IV, unit: 8576, dose: 180, dose_unit_label: "mg/m2", cycle_days: 14, tox: [myelo, diarrhea, emesis]}
  1397141: {name: bevacizumab, category: 2, route: IV, unit: 8576, dose: 5, dose_unit_label: "mg/kg", cycle_days: 14, reducible: false}
  1314273: {name: rituximab, category: 2, route: IV, unit: 8576, dose: 375, dose_unit_label: "mg/m2", cycle_days: 21, reducible: false}
  # vincristine 성인 1회 상한 2 mg (R-CHOP 등 표준 처방의 상한)
  1308290: {name: vincristine, category: 1, route: IV, unit: 8576, dose: 1.4, dose_unit_label: "mg/m2", cycle_days: 21, max_dose_mg: 2, dose_round: 0.1, tox: [neuropathy]}
  1551099: {name: prednisone, category: 6, route: PO, unit: 8576, dose: 100, dose_unit_label: "mg", cycle_days: 21, course_days: 5}
  1350504: {name: etoposide, category: 1, route: IV, unit: 8576, dose: 100, dose_unit_label: "mg/m2", cycle_days: 21, tox: [myelo, emesis, mucositis]}
  1329241: {name: bleomycin, category: 1, route: IV, unit: 8510, dose: 10, dose_unit_label: "unit/m2", cycle_days: 14, tox: [rash]}
  1311409: {name: dacarbazine, category: 1, route: IV, unit: 8576, dose: 375, dose_unit_label: "mg/m2", cycle_days: 14, tox: [myelo, emesis]}
  19008264: {name: vinblastine, category: 1, route: IV, unit: 8576, dose: 6, dose_unit_label: "mg/m2", cycle_days: 14, tox: [myelo, neuropathy]}
  # leucovorin(항암제 아님): FOLFOX/FOLFIRI 의 400 mg/m2 (라세미체 기준)
  1388796: {name: leucovorin, category: null, route: IV, unit: 8576, dose: 400, dose_unit_label: "mg/m2", cycle_days: 14}
  # durvalumab: 10 mg/kg 2주 간격 (Imfinzi 라벨, PACIFIC 의 III기 NSCLC 동시화학방사선 후 공고요법)
  1594034: {name: durvalumab, category: 5, route: IV, unit: 8576, dose: 10, dose_unit_label: "mg/kg", cycle_days: 14, reducible: false, tox: [rash, diarrhea, hepatic]}
  # pertuzumab 3주 간격: 첫 투여 840 mg(부하) 이후 420 mg. 직전 투여 후 42일(6주) 이상이면 다시 840 mg (Perjeta 라벨 2.2).
  42801287: {name: pertuzumab, category: 2, route: IV, unit: 8576, dose: 420, dose_unit_label: "mg", cycle_days: 21, loading_dose: 840, reload_gap_days: 42, reducible: false, tox: [diarrhea, rash]}
  # palbociclib: 125 mg 1일 1회 21일 복용 후 7일 휴약(28일 주기). 감량 단계 125 → 100 → 75 mg (Ibrance 라벨).
  45892075: {name: palbociclib, category: 2, route: PO, unit: 8576, dose: 125, dose_unit_label: "mg", cycle_days: 28, course_days: 21, reduce_levels: [125, 100, 75], tox: [myelo]}
  # panitumumab: 6 mg/kg 2주 간격 (Vectibix 라벨)
  19100985: {name: panitumumab, category: 2, route: IV, unit: 8576, dose: 6, dose_unit_label: "mg/kg", cycle_days: 14, tox: [rash, diarrhea]}
