# 규칙 카탈로그(단계 1)와 가상데이터 생성기(단계 2)가 공유하는 대표 concept 목록.
# 모든 concept_id 는 기준 어휘 OHDSI v20260829 의 표준·유효 개념이다 (docs/vocabulary.md).
#   진단·이상사례·시술 = SNOMED, 검사 = LOINC, 약물 = RxNorm (Ingredient), 단위 = UCUM.
#   name 은 사람이 읽는 이름이고, 어휘의 concept_name 과 다를 수 있다.
# 2026-11-19 에 어휘와 대조해 이름과 맞지 않던 59개를 고쳤다. synth/check_vocab.py 가 어휘와 어긋나면 실패한다.
# (검증 프로그램은 이 목록을 '허용 집합' 이 아니라 '코호트 정의 및 타당성 범위' 용도로만 사용한다.)

cohort_definition:
  LUNG_CANCER:
    condition_concept_ids: [258369, 4115276, 4110591]     # Primary malignant neoplasm of lung / NSCLC / SCLC
    kcd_prefix: ["C34"]
    age_at_index: {median_min: 55, median_max: 75}
    female_ratio: {min: 0.2, max: 0.6}
  BREAST_CANCER:
    condition_concept_ids: [4112853, 81250]                # Malignant neoplasm of breast / Carcinoma in situ of breast
    kcd_prefix: ["C50", "D05"]
    age_at_index: {median_min: 40, median_max: 65}
    female_ratio: {min: 0.95, max: 1.0}
