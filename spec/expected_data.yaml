# 데이터 충실도: 질환별 기대 데이터 (손으로 관리, 결정 2026-11-19)
#
# 규칙(rules/)은 "있는 행이 맞게 적혔는가"를 보고, 이 파일은 "있어야 할 기록이 실제로 있는가"를 본다.
# 근거와 결정은 docs/data-sufficiency.md. 결과는 오류·경고와 섞지 않고 보고서의 '데이터 충실도' 절과
# summary.json 의 sufficiency 에 비율로만 싣는다(충족 판정·목표치 없음).
#
# 실행(엔진 공통, dq/engine.py · dq-ts/src/sufficiency.ts):
#   1. _CONCEPT_SET(set_id, concept_id)  spec/concept_sets.yaml (아래 concept_sets 를 기준 어휘 v20260829 로 펼친 것,
#      python spec/build_concept_sets.py)
#   2. _EVENTS(person_id, set_id, event_date)  events 의 표에서 개념 집합에 든 기록. 표·열이 없으면 그 표는 뺀다
#   3. setup 의 SQL 을 차례로 실행. {ANCHOR} 는 anchors 의 코호트별 SQL, {DISEASE} 는 질환 본표
#   4. items 의 SQL 마다 대상 단위 한 행: person_id, unit_key, met(참/거짓), detail(미충족 사유), per_year(1인·1년당 횟수, 없으면 NULL)
#      setup_requires 나 requires 의 표가 없으면 그 항목은 건너뛴다
#
# 기간은 docs/data-sufficiency.md 의 제안 구간이다. 관찰 종료일 = 마지막 방문일(종료일 없으면 시작일)과 사망일 중 이른 날.

concept_sets:
  # 일반 검사: LOINC 구성요소(component) + 검체(system) 로 같은 검사의 모든 표준 코드
  HEIGHT:      {name: 키, loinc_components: [Body height], systems: ['^Patient']}
  WEIGHT:      {name: 체중, loinc_components: [Body weight], systems: ['^Patient']}
  BMI:         {name: 체질량지수, loinc_components: [Body mass index (BMI)], systems: ['^Patient']}
  HBA1C:       {name: HbA1c, loinc_components: [Hemoglobin A1c/Hemoglobin.total], systems: [Blood]}
  WBC:         {name: 백혈구, loinc_components: [Leukocytes], systems: [Blood]}
  NEUTROPHILS: {name: 호중구, loinc_components: [Neutrophils], systems: [Blood]}
  HEMOGLOBIN:  {name: 혈색소, loinc_components: [Hemoglobin], systems: [Blood]}
  PLATELETS:   {name: 혈소판, loinc_components: [Platelets], systems: [Blood]}
  AST:         {name: AST, loinc_components: [Aspartate aminotransferase], systems: [Serum or Plasma]}
  ALT:         {name: ALT, loinc_components: [Alanine aminotransferase], systems: [Serum or Plasma, 'Serum, Plasma or Blood']}
  CEA:         {name: CEA, loinc_components: [Carcinoembryonic Ag], systems: [Serum or Plasma]}
  LDH:         {name: LDH, loinc_components: [Lactate dehydrogenase], systems: [Serum or Plasma]}
  CREATININE:  {name: 크레아티닌, loinc_components: [Creatinine], systems: [Serum or Plasma]}
  EGFR_RATE:   {name: eGFR, loinc_components: [Glomerular filtration rate], systems: [Serum or Plasma, 'Serum, Plasma or Blood']}
  CHOLESTEROL: {name: 총콜레스테롤, loinc_components: [Cholesterol], systems: [Serum or Plasma]}
  LDL:         {name: LDL 콜레스테롤, loinc_components: [Cholesterol in LDL], systems: [Serum or Plasma]}
  SBP:         {name: 수축기 혈압, loinc_components: [Intravascular systolic], systems: [Arterial system]}
  DBP:         {name: 이완기 혈압, loinc_components: [Intravascular diastolic], systems: [Arterial system]}
  UACR:        {name: 소변 알부민/크레아티닌비, loinc_components: [Albumin/Creatinine], systems: [Urine]}
  # 바이오마커·병기: MEASUREMENT 에 LOINC 로 적는다(결정 2026-11-19). 결과는 value_as_concept_id 또는 value_source_value
  EGFR_MUT:    {name: EGFR 유전자 검사, loinc_components: ['EGFR gene%']}
  ALK:         {name: ALK 유전자 검사, loinc_components: ['ALK gene%']}
  HER2:        {name: HER2 검사, loinc_components: [HER2 Ag, 'Cells.HER2%', 'ERBB2 gene duplication', 'ERBB2 gene copy number%', 'ERBB2 gene (HER2)%'], exclude_systems: [Serum, Plasma, Serum or Plasma]}
  ER:          {name: 에스트로겐 수용체, loinc_components: [Estrogen receptor, Estrogen receptor Ag, Cells.estrogen receptor/Cells], exclude_systems: [Serum, Plasma, Serum or Plasma]}
  PR:          {name: 프로게스테론 수용체, loinc_components: [Progesterone receptor, Progesterone receptor Ag, Cells.progesterone receptor/Cells], exclude_systems: [Serum, Plasma, Serum or Plasma]}
  STAGE:       {name: 암 병기군, concepts: [3031548, 40762588, 40762594, 40762600], descendants_of: [4161178]}
  # 림프종 병기: SNOMED 'Lymphoma stage'(4299327, 하위 개념 없음)만. 범용 병기군(STAGE)·Tumor stage 계열은 림프종 병기로 추론하지 않는다
  LYMPHOMA_STAGE: {name: 림프종 병기, concepts: [4299327]}
  MMR_MSI:     {name: MMR·MSI 검사, loinc_components: ['Microsatellite instability%', PMS2 Ag, 'DNA mismatch repair%'], concepts: [37174395, 45773613]}
  RAS:         {name: RAS 유전자 검사, loinc_components: ['KRAS gene%', 'NRAS gene%', 'KRAS and NRAS gene', 'KRAS & NRAS gene%']}
  # 관찰·시술·진단
  ECOG:        {name: ECOG 수행 상태, concepts: [36303470]}
  CT_CHEST:    {name: 흉부 CT, descendants_of: [4058335]}
  PET_CT:      {name: PET-CT, descendants_of: [42872445]}
  BM_BIOPSY:   {name: 골수 생검, descendants_of: [4119553]}
  DIABETES_DX: {name: 당뇨병 진단, descendants_of: [201820]}

events:
- {table: MEASUREMENT, concept: measurement_concept_id, date: measurement_date}
- {table: PROCEDURE_OCCURRENCE, concept: procedure_concept_id, date: procedure_date}
- {table: OBSERVATION, concept: observation_concept_id, date: observation_date}
- {table: CONDITION_OCCURRENCE, concept: condition_concept_id, date: condition_start_date}

# 기준일: 폐암·유방암·대장암 diag_rgst_ymd, 림프종 diagnosis_date, 당뇨병 condition_start_date,
# MASLD 는 날짜 필드가 없어 질환 본표 visit_occurrence_id 가 가리키는 방문의 시작일. 환자에 여러 행이면 가장 이른 날.
anchors:
  LUNG_CANCER: SELECT person_id, MIN(diag_rgst_ymd) AS anchor_date FROM {DISEASE} WHERE person_id IS NOT NULL GROUP BY person_id
  BREAST_CANCER: SELECT person_id, MIN(diag_rgst_ymd) AS anchor_date FROM {DISEASE} WHERE person_id IS NOT NULL GROUP BY person_id
  COLORECTAL_CANCER: SELECT person_id, MIN(diag_rgst_ymd) AS anchor_date FROM {DISEASE} WHERE person_id IS NOT NULL GROUP BY person_id
  LYMPHOMA: SELECT person_id, MIN(diagnosis_date) AS anchor_date FROM {DISEASE} WHERE person_id IS NOT NULL GROUP BY person_id
  DIABETES: SELECT person_id, MIN(condition_start_date) AS anchor_date FROM {DISEASE} WHERE person_id IS NOT NULL GROUP BY person_id
  MASLD: >-
    SELECT d.person_id, MIN(v.visit_start_date) AS anchor_date FROM {DISEASE} d
    LEFT JOIN VISIT_OCCURRENCE v ON v.visit_occurrence_id = d.visit_occurrence_id
    WHERE d.person_id IS NOT NULL GROUP BY d.person_id

setup_requires: [PERSON, VISIT_OCCURRENCE]
setup:
- CREATE TEMP TABLE _ANCHOR AS {ANCHOR}
- >-
  CREATE TEMP TABLE _BASE AS
  SELECT p.person_id, a.anchor_date,
         CASE WHEN p.death_date IS NOT NULL AND (o.last_visit IS NULL OR p.death_date < o.last_visit) THEN p.death_date ELSE o.last_visit END AS obs_end
  FROM (SELECT person_id, MIN(death_date) AS death_date FROM PERSON WHERE person_id IS NOT NULL GROUP BY person_id) p
  LEFT JOIN _ANCHOR a ON a.person_id = p.person_id
  LEFT JOIN (SELECT person_id, MAX(COALESCE(visit_end_date, visit_start_date)) AS last_visit FROM VISIT_OCCURRENCE
             WHERE person_id IS NOT NULL GROUP BY person_id) o ON o.person_id = p.person_id
- >-
  CREATE TEMP MACRO _has(pid, sid, d0, d1) AS
  EXISTS (SELECT 1 FROM _EVENTS e WHERE e.person_id = pid AND e.set_id = sid AND e.event_date BETWEEN d0 AND d1)
- >-
  CREATE TEMP MACRO _ndays(pid, sid, d0, d1) AS
  (SELECT COUNT(DISTINCT e.event_date) FROM _EVENTS e WHERE e.person_id = pid AND e.set_id = sid AND e.event_date BETWEEN d0 AND d1)
- >-
  CREATE TEMP MACRO _rcls(pid, sid, d0, d1) AS
  COALESCE((SELECT MAX(CASE WHEN isfinite(TRY_CAST(m.value_as_number AS DOUBLE)) OR TRY_CAST(m.value_as_concept_id AS BIGINT) > 0 THEN 3
                            WHEN NULLIF(TRIM(CAST(m.value_source_value AS VARCHAR)), '') IS NOT NULL THEN 2 ELSE 1 END)
            FROM MEASUREMENT m JOIN _CONCEPT_SET s ON s.concept_id = m.measurement_concept_id AND s.set_id = sid
            WHERE m.person_id = pid AND m.measurement_date BETWEEN d0 AND d1), 0)
- >-
  CREATE TEMP MACRO _fib4(pid, d0, d1) AS
  EXISTS (SELECT 1 FROM _EVENTS a
          JOIN _EVENTS l ON l.person_id = a.person_id AND l.event_date = a.event_date AND l.set_id = 'ALT'
          JOIN _EVENTS t ON t.person_id = a.person_id AND t.event_date = a.event_date AND t.set_id = 'PLATELETS'
          WHERE a.person_id = pid AND a.set_id = 'AST' AND a.event_date BETWEEN d0 AND d1)
- >-
  CREATE TEMP MACRO _fib4_vals(pid, d0, d1) AS
  EXISTS (SELECT 1 FROM MEASUREMENT a
          JOIN _CONCEPT_SET sa ON sa.concept_id = a.measurement_concept_id AND sa.set_id = 'AST'
          JOIN MEASUREMENT l ON l.person_id = a.person_id AND l.measurement_date = a.measurement_date
          JOIN _CONCEPT_SET sl ON sl.concept_id = l.measurement_concept_id AND sl.set_id = 'ALT'
          JOIN MEASUREMENT t ON t.person_id = a.person_id AND t.measurement_date = a.measurement_date
          JOIN _CONCEPT_SET st ON st.concept_id = t.measurement_concept_id AND st.set_id = 'PLATELETS'
          WHERE a.person_id = pid AND a.measurement_date BETWEEN d0 AND d1
            AND TRY_CAST(a.value_as_number AS DOUBLE) > 0 AND CAST(a.unit_concept_id AS BIGINT) IN (8645, 8923)
            AND TRY_CAST(l.value_as_number AS DOUBLE) > 0 AND CAST(l.unit_concept_id AS BIGINT) IN (8645, 8923)
            AND TRY_CAST(t.value_as_number AS DOUBLE) > 0 AND CAST(t.unit_concept_id AS BIGINT) IN (8848, 8961, 9444))
- >-
  CREATE TEMP MACRO _fib4_age(pid) AS
  EXISTS (SELECT 1 FROM PERSON p WHERE p.person_id = pid AND TRY_CAST(p.age_at_index AS DOUBLE) > 0)
- >-
  CREATE TEMP MACRO _fib4_calc(pid, d0, d1) AS
  _fib4_vals(pid, d0, d1) AND _fib4_age(pid)

items:
# ---------------------------------------------------------------- 공통
- id: EXP-COM-01
  title: 키
  scope: all
  unit: 환자
  target: 전 환자
  expect: 기준일 전 365일 ~ 후 90일에 1회 이상
  basis: BMI·체표면적 계산의 필수 변수 (EMA Data Quality Framework, extensiveness)
  requires: [MEASUREMENT]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           anchor_date IS NOT NULL AND _has(person_id, 'HEIGHT', anchor_date - 365, anchor_date + 90) AS met,
           CASE WHEN anchor_date IS NULL THEN '기준일 없음' ELSE '기준일 ' || CAST(anchor_date AS VARCHAR) || ' 전후 구간에 키 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE ORDER BY person_id

- id: EXP-COM-02
  title: 체중
  scope: all
  unit: 환자
  target: 전 환자
  expect: 기준일 전 365일 ~ 후 90일에 1회 이상
  basis: BMI·체표면적 계산의 필수 변수 (EMA Data Quality Framework, extensiveness)
  requires: [MEASUREMENT]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           anchor_date IS NOT NULL AND _has(person_id, 'WEIGHT', anchor_date - 365, anchor_date + 90) AS met,
           CASE WHEN anchor_date IS NULL THEN '기준일 없음' ELSE '기준일 ' || CAST(anchor_date AS VARCHAR) || ' 전후 구간에 체중 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE ORDER BY person_id

- id: EXP-COM-03
  title: 항암 요법 시작 전 키·체중
  scope: [LUNG_CANCER, BREAST_CANCER, COLORECTAL_CANCER, LYMPHOMA]
  unit: 요법
  target: SACT 요법
  expect: 요법 시작 전 30일 ~ 시작일에 키와 체중
  basis: ASCO/ONS 항암 투여 안전 기준 Standard 1.7
  requires: [SACT]
  sql: |
    SELECT person_id, 'SACT:' || sact_id AS unit_key,
           d IS NOT NULL AND _has(person_id, 'HEIGHT', d - 30, d) AND _has(person_id, 'WEIGHT', d - 30, d) AS met,
           CASE WHEN d IS NULL THEN '요법 시작일 없음'
                ELSE concat_ws('·', CASE WHEN NOT _has(person_id, 'HEIGHT', d - 30, d) THEN '키' END,
                                    CASE WHEN NOT _has(person_id, 'WEIGHT', d - 30, d) THEN '체중' END) || ' 없음 (시작 전 30일)' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM (SELECT person_id, sact_id, regimen_start_date AS d FROM SACT WHERE person_id IS NOT NULL) s
    ORDER BY person_id, unit_key

- id: EXP-COM-04
  title: 요법별 수행 상태(ECOG)
  scope: [LUNG_CANCER, BREAST_CANCER, COLORECTAL_CANCER, LYMPHOMA]
  unit: 요법
  target: SACT 요법
  expect: SACT.ecog_performance_status 기록
  basis: ASCO/ONS 항암 투여 안전 기준 Standard 1.6.1
  requires: [SACT]
  sql: |
    SELECT person_id, 'SACT:' || sact_id AS unit_key, ecog_performance_status IS NOT NULL AS met,
           'ecog_performance_status 없음' AS detail, CAST(NULL AS DOUBLE) AS per_year
    FROM SACT WHERE person_id IS NOT NULL ORDER BY person_id, unit_key

- id: EXP-COM-05
  title: 항암 요법 시작 전 혈구검사
  scope: [LUNG_CANCER, BREAST_CANCER, COLORECTAL_CANCER, LYMPHOMA]
  unit: 요법
  target: SACT 요법
  expect: 요법 시작 전 30일 ~ 시작일에 백혈구·호중구·혈색소·혈소판
  basis: ASCO/ONS 기준 3.9.8.3 (시점은 임상 확인 필요, 30일은 제안)
  requires: [SACT]
  sql: |
    SELECT person_id, 'SACT:' || sact_id AS unit_key,
           d IS NOT NULL AND _has(person_id, 'WBC', d - 30, d) AND _has(person_id, 'NEUTROPHILS', d - 30, d)
             AND _has(person_id, 'HEMOGLOBIN', d - 30, d) AND _has(person_id, 'PLATELETS', d - 30, d) AS met,
           CASE WHEN d IS NULL THEN '요법 시작일 없음'
                ELSE concat_ws('·', CASE WHEN NOT _has(person_id, 'WBC', d - 30, d) THEN '백혈구' END,
                                    CASE WHEN NOT _has(person_id, 'NEUTROPHILS', d - 30, d) THEN '호중구' END,
                                    CASE WHEN NOT _has(person_id, 'HEMOGLOBIN', d - 30, d) THEN '혈색소' END,
                                    CASE WHEN NOT _has(person_id, 'PLATELETS', d - 30, d) THEN '혈소판' END) || ' 없음 (시작 전 30일)' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM (SELECT person_id, sact_id, regimen_start_date AS d FROM SACT WHERE person_id IS NOT NULL) s
    ORDER BY person_id, unit_key

# ---------------------------------------------------------------- 폐암
- id: EXP-LC-01
  title: EGFR·ALK 검사 결과
  scope: [LUNG_CANCER]
  unit: 환자
  target: 선암(histologic_diagnosis=1) 중 IV기(clinical_stage IV* 또는 stage_iv_diagnosis_date 있음)
  expect: EGFR 검사와 ALK 검사 기록이 각각 1회 이상 (MEASUREMENT, LOINC)
  basis: CAP/IASLC/AMP 분자검사 지침 (ASCO 인정)
  requires: [MEASUREMENT]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           _has(person_id, 'EGFR_MUT', DATE '1900-01-01', DATE '2999-12-31') AND _has(person_id, 'ALK', DATE '1900-01-01', DATE '2999-12-31') AS met,
           concat_ws('·', CASE WHEN NOT _has(person_id, 'EGFR_MUT', DATE '1900-01-01', DATE '2999-12-31') THEN 'EGFR' END,
                          CASE WHEN NOT _has(person_id, 'ALK', DATE '1900-01-01', DATE '2999-12-31') THEN 'ALK' END) || ' 검사 기록 없음' AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM (SELECT DISTINCT person_id FROM {DISEASE}
          WHERE person_id IS NOT NULL AND histologic_diagnosis = 1
            AND (clinical_stage LIKE 'IV%' OR stage_iv_diagnosis_date IS NOT NULL)) t
    ORDER BY person_id

- id: EXP-LC-03
  title: 첫 요법 전 EGFR 결과
  scope: [LUNG_CANCER]
  unit: 환자
  target: EXP-LC-01 대상(선암 IV기) 중 시작일이 있는 SACT 요법이 있는 환자. 첫 요법일 = 가장 이른 regimen_start_date
  expect: 첫 요법일 이전 날짜에 결과가 있는 EGFR MEASUREMENT 행 (결과 = 유한 value_as_number, 양수 value_as_concept_id, 또는 비지 않은 value_source_value). measurement_date 기준이며 검체 채취일로 가용 시점을 추정하지 않음
  basis: CAP/IASLC/AMP 분자검사 지침 (ASCO 인정). 표적 요법 선택 전 결과 필요 (시점 정의는 임상 확인 필요)
  requires: [MEASUREMENT, SACT]
  sql: |
    WITH t AS (
      SELECT d.person_id, (SELECT MIN(s.regimen_start_date) FROM SACT s WHERE s.person_id = d.person_id) AS f
      FROM (SELECT DISTINCT person_id FROM {DISEASE}
            WHERE person_id IS NOT NULL AND histologic_diagnosis = 1
              AND (clinical_stage LIKE 'IV%' OR stage_iv_diagnosis_date IS NOT NULL)) d),
    c AS (
      SELECT t.person_id, t.f,
             _rcls(t.person_id, 'EGFR_MUT', DATE '1900-01-01', t.f - 1) AS pre,
             _rcls(t.person_id, 'EGFR_MUT', t.f, t.f) AS day,
             _rcls(t.person_id, 'EGFR_MUT', t.f + 1, DATE '2999-12-31') AS post
      FROM t WHERE t.f IS NOT NULL)
    SELECT person_id, 'PERSON:' || person_id AS unit_key, pre >= 2 AS met,
           CASE WHEN day >= 2 THEN 'day: EGFR 결과가 첫 요법일 ' || CAST(f AS VARCHAR) || ' 당일에만 있음'
                WHEN post >= 2 THEN 'post: EGFR 결과가 첫 요법일 ' || CAST(f AS VARCHAR) || ' 이후에만 있음'
                WHEN pre = 1 THEN 'missing_result: 첫 요법일 이전 EGFR 행은 있으나 결과 없음'
                WHEN day + post > 0 THEN 'missing_result: EGFR 행이 첫 요법일 당일·이후에만 있고 결과 없음'
                ELSE 'none: EGFR 행 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM c ORDER BY person_id

- id: EXP-LC-04
  title: 첫 요법 전 ALK 결과
  scope: [LUNG_CANCER]
  unit: 환자
  target: EXP-LC-01 대상(선암 IV기) 중 시작일이 있는 SACT 요법이 있는 환자. 첫 요법일 = 가장 이른 regimen_start_date
  expect: 첫 요법일 이전 날짜에 결과가 있는 ALK MEASUREMENT 행 (결과 = 유한 value_as_number, 양수 value_as_concept_id, 또는 비지 않은 value_source_value). measurement_date 기준이며 검체 채취일로 가용 시점을 추정하지 않음
  basis: CAP/IASLC/AMP 분자검사 지침 (ASCO 인정). 표적 요법 선택 전 결과 필요 (시점 정의는 임상 확인 필요)
  requires: [MEASUREMENT, SACT]
  sql: |
    WITH t AS (
      SELECT d.person_id, (SELECT MIN(s.regimen_start_date) FROM SACT s WHERE s.person_id = d.person_id) AS f
      FROM (SELECT DISTINCT person_id FROM {DISEASE}
            WHERE person_id IS NOT NULL AND histologic_diagnosis = 1
              AND (clinical_stage LIKE 'IV%' OR stage_iv_diagnosis_date IS NOT NULL)) d),
    c AS (
      SELECT t.person_id, t.f,
             _rcls(t.person_id, 'ALK', DATE '1900-01-01', t.f - 1) AS pre,
             _rcls(t.person_id, 'ALK', t.f, t.f) AS day,
             _rcls(t.person_id, 'ALK', t.f + 1, DATE '2999-12-31') AS post
      FROM t WHERE t.f IS NOT NULL)
    SELECT person_id, 'PERSON:' || person_id AS unit_key, pre >= 2 AS met,
           CASE WHEN day >= 2 THEN 'day: ALK 결과가 첫 요법일 ' || CAST(f AS VARCHAR) || ' 당일에만 있음'
                WHEN post >= 2 THEN 'post: ALK 결과가 첫 요법일 ' || CAST(f AS VARCHAR) || ' 이후에만 있음'
                WHEN pre = 1 THEN 'missing_result: 첫 요법일 이전 ALK 행은 있으나 결과 없음'
                WHEN day + post > 0 THEN 'missing_result: ALK 행이 첫 요법일 당일·이후에만 있고 결과 없음'
                ELSE 'none: ALK 행 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM c ORDER BY person_id

