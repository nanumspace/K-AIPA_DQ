# ---------------------------------------------------------------- 림프종
- id: EXP-LY-01
  title: 진단 시 LDH
  scope: [LYMPHOMA]
  unit: 환자
  target: 전 환자
  expect: 기준일 전후 90일에 1회 이상
  basis: IPI (NEJM 1993) 구성요소
  requires: [MEASUREMENT]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           anchor_date IS NOT NULL AND _has(person_id, 'LDH', anchor_date - 90, anchor_date + 90) AS met,
           CASE WHEN anchor_date IS NULL THEN '기준일 없음' ELSE '기준일 전후 90일에 LDH 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE ORDER BY person_id

- id: EXP-LY-02
  title: IPI 구성요소 (셀 수 있는 것만)
  scope: [LYMPHOMA]
  unit: 환자
  target: DLBCL (cell_of_origin 이 GCB·ABC/non-GCB·unclassifiable)
  expect: 나이(PERSON.age_at_index), 진단 시 LDH(전후 90일), 수행 상태(SACT ECOG 또는 전후 90일 ECOG 관찰). 병기·결절외 침범 수는 필드가 없어 제외
  basis: IPI (NEJM 1993)
  requires: [MEASUREMENT, SACT]
  sql: |
    WITH t AS (
      SELECT b.person_id, b.anchor_date AS a,
             (SELECT MIN(age_at_index) FROM PERSON p WHERE p.person_id = b.person_id) IS NOT NULL AS age_ok,
             b.anchor_date IS NOT NULL AND _has(b.person_id, 'LDH', b.anchor_date - 90, b.anchor_date + 90) AS ldh_ok,
             (b.anchor_date IS NOT NULL AND _has(b.person_id, 'ECOG', b.anchor_date - 90, b.anchor_date + 90)) AS ecog_obs
      FROM _BASE b
      WHERE EXISTS (SELECT 1 FROM {DISEASE} d WHERE d.person_id = b.person_id AND d.cell_of_origin IN ('GCB', 'ABC/non-GCB', 'unclassifiable')))
    SELECT person_id, 'PERSON:' || person_id AS unit_key, age_ok AND ldh_ok AND ecog_ok AS met,
           concat_ws('·', CASE WHEN NOT age_ok THEN '나이' END, CASE WHEN NOT ldh_ok THEN 'LDH' END, CASE WHEN NOT ecog_ok THEN 'ECOG' END) || ' 없음' AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM (SELECT t.*, ecog_obs OR EXISTS (SELECT 1 FROM SACT s WHERE s.person_id = t.person_id AND s.ecog_performance_status IS NOT NULL) AS ecog_ok FROM t)
    ORDER BY person_id

- id: EXP-LY-03
  title: 진단 시 PET-CT 또는 골수 생검
  scope: [LYMPHOMA]
  unit: 환자
  target: 전 환자
  expect: 기준일 전후 90일에 둘 중 하나 1회 이상
  basis: 병기 결정 검사 (지침 조항 확인 필요)
  requires: [PROCEDURE_OCCURRENCE]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           anchor_date IS NOT NULL AND (_has(person_id, 'PET_CT', anchor_date - 90, anchor_date + 90) OR _has(person_id, 'BM_BIOPSY', anchor_date - 90, anchor_date + 90)) AS met,
           CASE WHEN anchor_date IS NULL THEN '기준일 없음' ELSE '기준일 전후 90일에 PET-CT·골수 생검 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE ORDER BY person_id

- id: EXP-LY-04
  title: 진단 시 림프종 병기 기록
  scope: [LYMPHOMA]
  unit: 환자
  target: 전 환자 (기준일 없으면 미충족)
  expect: 기준일 전후 90일에 림프종 병기(SNOMED 4299327) 측정 결과가 값과 함께 1회 이상. 범용 병기군·Tumor stage 로 대체하지 않음
  basis: Ann Arbor/Lugano 병기는 IPI·치료 계획의 기본 변수 (지침 조항 확인 필요)
  requires: [MEASUREMENT]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           anchor_date IS NOT NULL AND EXISTS (
             SELECT 1 FROM MEASUREMENT m JOIN _CONCEPT_SET s ON s.concept_id = m.measurement_concept_id AND s.set_id = 'LYMPHOMA_STAGE'
             WHERE m.person_id = _BASE.person_id AND m.measurement_date BETWEEN anchor_date - 90 AND anchor_date + 90
               AND (CAST(m.value_as_concept_id AS BIGINT) > 0 OR NULLIF(TRIM(CAST(m.value_source_value AS VARCHAR)), '') IS NOT NULL
                    OR m.value_as_number IS NOT NULL)) AS met,
           CASE WHEN anchor_date IS NULL THEN '기준일 없음' ELSE '기준일 전후 90일에 값이 있는 림프종 병기 기록 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE ORDER BY person_id

- id: EXP-LY-05
  title: IPI 나이
  scope: [LYMPHOMA]
  unit: 환자
  target: DLBCL (cell_of_origin 이 GCB·ABC/non-GCB·unclassifiable). EXP-LY-02 와 같은 분모
  expect: PERSON.age_at_index 기록
  basis: IPI (NEJM 1993) 구성요소
  requires: []
  sql: |
    SELECT b.person_id, 'PERSON:' || b.person_id AS unit_key,
           (SELECT MIN(age_at_index) FROM PERSON p WHERE p.person_id = b.person_id) IS NOT NULL AS met,
           'age_at_index 없음' AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE b
    WHERE EXISTS (SELECT 1 FROM {DISEASE} d WHERE d.person_id = b.person_id AND d.cell_of_origin IN ('GCB', 'ABC/non-GCB', 'unclassifiable'))
    ORDER BY b.person_id

