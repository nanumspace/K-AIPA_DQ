  unit: 환자
  target: DLBCL (cell_of_origin 이 GCB·ABC/non-GCB·unclassifiable). EXP-LY-02 와 같은 분모
  expect: SACT.ecog_performance_status 기록 또는 기준일 전후 90일 ECOG 관찰
