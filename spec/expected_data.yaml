# ---------------------------------------------------------------- MASLD
- id: EXP-MASLD-01
  title: FIB-4 구성 검사 (AST·ALT·혈소판 같은 날)
  scope: [MASLD]
  unit: 환자
  target: 전 환자
  expect: 기준일 전 365일 ~ 후 90일에 세 검사가 같은 날 모두
  basis: AASLD 2023 진료 지침 (FIB-4 1차 위험 평가)
  requires: [MEASUREMENT]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           anchor_date IS NOT NULL AND _fib4(person_id, anchor_date - 365, anchor_date + 90) AS met,
           CASE WHEN anchor_date IS NULL THEN '기준일 없음' ELSE '기준일 전후 구간에 AST·ALT·혈소판을 같은 날 잰 기록 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE ORDER BY person_id

- id: EXP-MASLD-04
  title: FIB-4 계산 가능 (같은 날 수치·단위가 유효한 AST·ALT·혈소판 + 나이)
  scope: [MASLD]
  unit: 환자
  target: 전 환자 (MASLD-01 의 '검사 기록 유무'와 별개로 실제 계산 가능성을 본다)
  expect: 기준일 전 365일 ~ 후 90일의 같은 날에 AST·ALT(U/L)·혈소판(10^3/uL 동등 단위)이 모두 0 초과 수치이고 PERSON.age_at_index 가 0 초과
  basis: FIB-4 = 나이 × AST / (혈소판 × √ALT) (AASLD 2023). 계산 가능 비율 36% 보고 (Cureus 2026)
  requires: [MEASUREMENT, PERSON]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           anchor_date IS NOT NULL AND _fib4_calc(person_id, anchor_date - 365, anchor_date + 90) AS met,
           CASE WHEN anchor_date IS NULL THEN '기준일 없음'
                WHEN NOT (_has(person_id, 'AST', anchor_date - 365, anchor_date + 90)
                          AND _has(person_id, 'ALT', anchor_date - 365, anchor_date + 90)
                          AND _has(person_id, 'PLATELETS', anchor_date - 365, anchor_date + 90))
                  THEN '기준일 전후 구간에 구성 검사 누락: ' || concat_ws(', ',
                         CASE WHEN NOT _has(person_id, 'AST', anchor_date - 365, anchor_date + 90) THEN 'AST' END,
                         CASE WHEN NOT _has(person_id, 'ALT', anchor_date - 365, anchor_date + 90) THEN 'ALT' END,
                         CASE WHEN NOT _has(person_id, 'PLATELETS', anchor_date - 365, anchor_date + 90) THEN '혈소판' END)
                WHEN NOT _fib4(person_id, anchor_date - 365, anchor_date + 90)
                  THEN '기준일 전후 구간에 AST·ALT·혈소판을 같은 날 잰 조합 없음'
                WHEN NOT _fib4_vals(person_id, anchor_date - 365, anchor_date + 90)
                  THEN '같은 날 조합은 있으나 값이 0 이하·없음이거나 단위가 유효하지 않음'
                ELSE '나이(PERSON.age_at_index) 없음 또는 0 이하' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE ORDER BY person_id

- id: EXP-MASLD-02
  title: FIB-4 반복 평가 (당뇨 동반)
  scope: [MASLD]
  unit: 환자
  target: 당뇨병 진단이 있고 관찰 기간 2년 이상인 환자 (대사 위험인자 2개 이상 기준은 정의 확인 필요라 제외)
  expect: 기준일부터 2년 구간마다 FIB-4 구성 검사(같은 날) 1회 이상
  basis: 'AASLD 2023: FIB-4 위험 평가는 1~2년마다 반복'
  requires: [MEASUREMENT]
  sql: |
    WITH b AS (
      SELECT person_id, anchor_date AS a, date_diff('day', anchor_date, obs_end) AS span FROM _BASE
      WHERE anchor_date IS NOT NULL AND obs_end IS NOT NULL AND date_diff('day', anchor_date, obs_end) >= 730
        AND _has(person_id, 'DIABETES_DX', DATE '1900-01-01', DATE '2999-12-31')),
    w AS (SELECT person_id, a, unnest(range(0, span // 730)) AS i FROM b),
    g AS (SELECT person_id, COUNT(*) AS n,
                 SUM(CASE WHEN _fib4(person_id, a + CAST(i * 730 AS INTEGER), a + CAST(i * 730 + 729 AS INTEGER)) THEN 0 ELSE 1 END) AS miss
          FROM w GROUP BY person_id)
    SELECT b.person_id, 'PERSON:' || b.person_id AS unit_key, g.miss = 0 AS met,
           '2년 구간 ' || g.n || '개 중 ' || g.miss || '개에 FIB-4 구성 검사 없음' AS detail,
           (SELECT COUNT(DISTINCT a.event_date) FROM _EVENTS a
              JOIN _EVENTS l ON l.person_id = a.person_id AND l.event_date = a.event_date AND l.set_id = 'ALT'
              JOIN _EVENTS t ON t.person_id = a.person_id AND t.event_date = a.event_date AND t.set_id = 'PLATELETS'
            WHERE a.person_id = b.person_id AND a.set_id = 'AST' AND a.event_date BETWEEN b.a AND b.a + CAST(b.span AS INTEGER)) * 365.25 / b.span AS per_year
    FROM b JOIN g ON g.person_id = b.person_id ORDER BY b.person_id

- id: EXP-MASLD-03
  title: 연 1회 체중 또는 BMI
  scope: [MASLD]
  unit: 환자
  target: 관찰 기간 1년 이상인 환자
  expect: 기준일부터 1년 구간마다 BMI, 또는 체중(키는 관찰 중 1회 이상) 1회 이상
  basis: 대사 위험인자 판정에 필요 (빈도는 제안)
  requires: [MEASUREMENT]
  sql: |
    WITH b AS (
      SELECT person_id, anchor_date AS a, date_diff('day', anchor_date, obs_end) AS span FROM _BASE
      WHERE anchor_date IS NOT NULL AND obs_end IS NOT NULL AND date_diff('day', anchor_date, obs_end) >= 365),
    w AS (SELECT person_id, a, span, unnest(range(0, span // 365)) AS i FROM b),
    g AS (SELECT person_id, COUNT(*) AS n,
                 SUM(CASE WHEN _has(person_id, 'BMI', a + CAST(i * 365 AS INTEGER), a + CAST(i * 365 + 364 AS INTEGER))
                            OR (_has(person_id, 'WEIGHT', a + CAST(i * 365 AS INTEGER), a + CAST(i * 365 + 364 AS INTEGER))
                                AND _has(person_id, 'HEIGHT', a - 365, a + CAST(span AS INTEGER))) THEN 0 ELSE 1 END) AS miss
          FROM w GROUP BY person_id)
    SELECT b.person_id, 'PERSON:' || b.person_id AS unit_key, g.miss = 0 AS met,
           '1년 구간 ' || g.n || '개 중 ' || g.miss || '개에 BMI·체중 없음' AS detail,
           (SELECT COUNT(DISTINCT e.event_date) FROM _EVENTS e
            WHERE e.person_id = b.person_id AND e.set_id IN ('WEIGHT', 'BMI') AND e.event_date BETWEEN b.a AND b.a + CAST(b.span AS INTEGER)) * 365.25 / b.span AS per_year
    FROM b JOIN g ON g.person_id = b.person_id ORDER BY b.person_id

# ---------------------------------------------------------------- 당뇨병
- id: EXP-DM-01
  title: 진단 시 HbA1c
  scope: [DIABETES]
  unit: 환자
  target: 전 환자
  expect: 기준일 전후 90일에 1회 이상
  basis: 'ADA Standards of Care 2026, 6장: 초기 평가에서 A1C'
  requires: [MEASUREMENT]
  sql: |
    SELECT person_id, 'PERSON:' || person_id AS unit_key,
           anchor_date IS NOT NULL AND _has(person_id, 'HBA1C', anchor_date - 90, anchor_date + 90) AS met,
           CASE WHEN anchor_date IS NULL THEN '기준일 없음' ELSE '기준일 전후 90일에 HbA1c 없음' END AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM _BASE ORDER BY person_id

- id: EXP-DM-02
  title: 추적 중 HbA1c (6개월마다)
  scope: [DIABETES]
  unit: 환자
  target: 관찰 기간 6개월(182일) 이상인 환자
  expect: 기준일부터 182일 구간마다 1회 이상
  basis: 'ADA 권고 6.2: 연 2회 이상'
  requires: [MEASUREMENT]
  sql: |
    WITH b AS (
      SELECT person_id, anchor_date AS a, date_diff('day', anchor_date, obs_end) AS span FROM _BASE
      WHERE anchor_date IS NOT NULL AND obs_end IS NOT NULL AND date_diff('day', anchor_date, obs_end) >= 182),
    w AS (SELECT person_id, a, unnest(range(0, span // 182)) AS i FROM b),
    g AS (SELECT person_id, COUNT(*) AS n,
                 SUM(CASE WHEN _has(person_id, 'HBA1C', a + CAST(i * 182 AS INTEGER), a + CAST(i * 182 + 181 AS INTEGER)) THEN 0 ELSE 1 END) AS miss
          FROM w GROUP BY person_id)
    SELECT b.person_id, 'PERSON:' || b.person_id AS unit_key, g.miss = 0 AS met,
           '6개월 구간 ' || g.n || '개 중 ' || g.miss || '개에 HbA1c 없음' AS detail,
           _ndays(b.person_id, 'HBA1C', b.a, b.a + CAST(b.span AS INTEGER)) * 365.25 / b.span AS per_year
    FROM b JOIN g ON g.person_id = b.person_id ORDER BY b.person_id

- id: EXP-DM-03
  title: 연 1회 혈압·신기능·지질·체중
  scope: [DIABETES]
  unit: 환자
  target: 관찰 기간 1년 이상인 환자
  expect: 기준일부터 1년 구간마다 혈압(수축기·이완기), 크레아티닌 또는 eGFR, 총콜레스테롤 또는 LDL, 체중 또는 BMI
  basis: 영국 NDA 진료 과정 (국내 지침과의 차이 확인 필요). 네 요소 합성으로 유지하며 UACR 은 합성에 넣지 않고 EXP-DM-04, 요소별은 EXP-DM-05~08 에서 따로 센다. 발 검사는 개념 합의 전이라 제외
  requires: [MEASUREMENT]
  sql: |
    WITH b AS (
      SELECT person_id, anchor_date AS a, date_diff('day', anchor_date, obs_end) AS span FROM _BASE
      WHERE anchor_date IS NOT NULL AND obs_end IS NOT NULL AND date_diff('day', anchor_date, obs_end) >= 365),
    w AS (SELECT person_id, a + CAST(i * 365 AS INTEGER) AS d0, a + CAST(i * 365 + 364 AS INTEGER) AS d1
          FROM (SELECT person_id, a, unnest(range(0, span // 365)) AS i FROM b)),
    c AS (SELECT person_id,
                 _has(person_id, 'SBP', d0, d1) AND _has(person_id, 'DBP', d0, d1) AS bp,
                 _has(person_id, 'CREATININE', d0, d1) OR _has(person_id, 'EGFR_RATE', d0, d1) AS renal,
                 _has(person_id, 'CHOLESTEROL', d0, d1) OR _has(person_id, 'LDL', d0, d1) AS lipid,
                 _has(person_id, 'WEIGHT', d0, d1) OR _has(person_id, 'BMI', d0, d1) AS wt
          FROM w),
    g AS (SELECT person_id, COUNT(*) AS n,
                 SUM(CASE WHEN bp AND renal AND lipid AND wt THEN 0 ELSE 1 END) AS miss,
                 SUM(CASE WHEN bp THEN 0 ELSE 1 END) AS m_bp, SUM(CASE WHEN renal THEN 0 ELSE 1 END) AS m_renal,
                 SUM(CASE WHEN lipid THEN 0 ELSE 1 END) AS m_lipid, SUM(CASE WHEN wt THEN 0 ELSE 1 END) AS m_wt
          FROM c GROUP BY person_id)
    SELECT person_id, 'PERSON:' || person_id AS unit_key, miss = 0 AS met,
           '1년 구간 ' || n || '개 중 미충족 ' || miss || '개 (혈압 ' || m_bp || ', 신기능 ' || m_renal || ', 지질 ' || m_lipid || ', 체중 ' || m_wt || ')' AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM g ORDER BY person_id

- id: EXP-DM-04
  title: 연 1회 소변 알부민/크레아티닌비(UACR)
  scope: [DIABETES]
  unit: 환자
  target: 관찰 기간 1년 이상인 환자
  expect: 기준일부터 1년 구간마다 소변 알부민/크레아티닌비 1회 이상
  basis: 'ADA Standards of Care 2026, 11장: 당뇨병 환자는 UACR 과 eGFR 을 연 1회 이상 평가 (EXP-DM-03 합성에는 넣지 않음)'
  requires: [MEASUREMENT]
  sql: |
    WITH b AS (
      SELECT person_id, anchor_date AS a, date_diff('day', anchor_date, obs_end) AS span FROM _BASE
      WHERE anchor_date IS NOT NULL AND obs_end IS NOT NULL AND date_diff('day', anchor_date, obs_end) >= 365),
    w AS (SELECT person_id, a + CAST(i * 365 AS INTEGER) AS d0, a + CAST(i * 365 + 364 AS INTEGER) AS d1
          FROM (SELECT person_id, a, unnest(range(0, span // 365)) AS i FROM b)),
    g AS (SELECT person_id, COUNT(*) AS n,
                 SUM(CASE WHEN _has(person_id, 'UACR', d0, d1) THEN 0 ELSE 1 END) AS miss
          FROM w GROUP BY person_id)
    SELECT person_id, 'PERSON:' || person_id AS unit_key, miss = 0 AS met,
           '1년 구간 ' || n || '개 중 ' || miss || '개에 UACR 없음' AS detail,
           CAST(NULL AS DOUBLE) AS per_year
    FROM g ORDER BY person_id

